<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffd6ea; --bg2:#ffc5e1; --ink:#6b1a52; --hot:#ff4fa3; --blush:#fff0f7; --lilac:#c9a6ff; --angry:#ff5a6e;
  --font:'Press Start 2P','Courier New',monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a0f2e;--bg2:#4a1439;--ink:#ffd6ea;--blush:#5a1a45;--hot:#ff6fb5;--lilac:#a37be0}}
:root[data-theme="dark"]{--bg:#3a0f2e;--bg2:#4a1439;--ink:#ffd6ea;--blush:#5a1a45;--hot:#ff6fb5;--lilac:#a37be0}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;font-family:var(--font);color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),
                   linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);
  background-size:32px 32px;background-position:0 0,16px 16px;
  image-rendering:pixelated;overflow-x:hidden;
}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 20px}
section{width:100%;max-width:440px;text-align:center}
[hidden]{display:none!important}
.frame{background:var(--blush);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px 18px}
h1{font-size:clamp(20px,7vw,30px);line-height:1.5;margin:18px 0 12px;color:var(--hot);text-shadow:3px 3px 0 var(--ink)}
h2{font-size:clamp(14px,4.6vw,18px);line-height:1.6;margin:0 0 22px}
p{font-size:11px;line-height:2;margin:0 0 26px}
.btn{
  font-family:var(--font);font-size:16px;color:#fff;background:var(--hot);cursor:pointer;
  border:4px solid var(--ink);padding:16px 26px;box-shadow:6px 6px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;
}
.btn:hover{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.face:focus-visible{outline:4px dashed var(--ink);outline-offset:4px}
.start{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.choices{display:flex;gap:14px;justify-content:center}
.face{
  flex:1;max-width:170px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font);color:var(--ink);
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.ph{position:relative;display:block;width:100%;aspect-ratio:1;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--blush);transition:transform .1s}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .badge{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;image-rendering:pixelated}
.face:hover .ph{transform:scale(1.05)}
.face:active .ph{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
#msg{min-height:60px;margin-top:26px;font-size:12px;line-height:1.9}
.shake{animation:shake .4s steps(2) 3}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.jump{animation:jump .35s steps(3) 3}
@keyframes jump{50%{transform:translateY(-14px)}}
.again{margin-top:6px;font-size:10px;padding:12px 16px;background:var(--lilac)}
.heart{position:fixed;bottom:-30px;width:28px;height:auto;pointer-events:none;animation:up 2.2s steps(14) forwards;z-index:9}
@keyframes up{to{transform:translateY(-110vh)}}
.sp{display:inline-block;width:12px;height:12px;background:var(--hot);margin:0 6px;box-shadow:12px 0 0 var(--hot),-12px 0 0 var(--hot),0 12px 0 var(--hot),0 -12px 0 var(--hot)}

.q{font-size:12px;line-height:2;margin:22px 0 18px}
.row{display:flex;gap:14px;justify-content:center}
.btn.sm{font-size:13px;padding:12px 20px}
.btn.alt{background:var(--lilac);color:var(--ink)}
.letter{font-size:12px;line-height:2.2;text-align:left;margin:0 0 26px}
.w{display:inline-block;white-space:pre;opacity:0}
.w.on{opacity:1;animation:drop .3s steps(3)}
@keyframes drop{from{transform:translateY(10px)}}

    <h2>Non…</h2>
    <p>Tu ne connais pas la vraie raison.</p>
    <button class="btn sm" id="replay">Rejouer</button>
  </section>

    <p id="txt" class="letter" aria-live="polite"></p>
    <button class="btn" id="end" hidden>End</button>
  </section>
</main>

<section id="game" hidden>
  <div class="hud"><span id="score">Cœurs : 0</span><span id="time">Temps : 20</span></div>
  <div id="arena"></div>
  <div id="result" class="frame" hidden>
    <h2 id="final"></h2>
    <p class="rec">Mijn record is 23🤙🏾</p>
    <button class="btn sm" id="again2">Rejouer le jeu</button>
  </div>
</section>


<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var TEXT="Hey Doriane ik heb jouw geblokkeerd omdat ik alles altijd heb gemeend met jou, alles wat ik zij alles wat ik deed. Wat we hadden zal ik nooit meer leven et c’est ok i guess. Maar ik kan niet gewoon verder met mijn leven en met jou gewoon spreken alsof er nooit iets is gebeurd🤷🏾‍♂️.";
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var heart='<svg class="heart" viewBox="0 0 7 6" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><path fill="#ff4fa3" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/><path fill="#fff" d="M1 1h1v1H1z"/></svg>';
  var hg=heart.replace(' class="heart"','');
  var faces=[$('angry'),$('happy')], askTimer, spawner, ticker, score=0, time=20;

  function show(id){
    ['intro','choose','verdict','letter'].forEach(function(x){$(x).hidden=(x!==id)});
    document.querySelector('main').hidden=(id==='game');
    $('game').hidden=(id!=='game');
  }
  function hearts(n){
    for(var i=0;i<n;i++){
      var d=document.createElement('div');d.innerHTML=heart;var h=d.firstChild;
      h.style.left=(Math.random()*90+2)+'vw';h.style.animationDelay=(Math.random()*.8)+'s';
      document.body.appendChild(h);setTimeout(function(x){x.remove()},3200,h);
    }
  }
  function pick(t,text,cls,fx){
    faces.forEach(function(b){b.classList.remove('shake','jump');b.disabled=true});
    $('msg').textContent=text;void t.offsetWidth;t.classList.add(cls);
    if(fx)hearts(14);
    askTimer=setTimeout(function(){$('ask').hidden=false},1800);
  }
  function reset(){
    clearTimeout(askTimer);
    faces.forEach(function(b){b.disabled=false;b.classList.remove('shake','jump')});
    $('msg').textContent='';$('ask').hidden=true;show('intro');
  }
  function typeText(){
    var t=$('txt');t.innerHTML='';$('end').hidden=true;
    TEXT.split(' ').forEach(function(w){var s=document.createElement('span');s.className='w';s.textContent=w+' ';t.appendChild(s)});
    var sp=t.children,i=0;
    (function next(){
      if(i>=sp.length){setTimeout(function(){$('end').hidden=false},600);return}
      sp[i++].classList.add('on');setTimeout(next,reduce?0:230);
    })();
  }
  function upd(){$('score').textContent='Cœurs : '+score;$('time').textContent='Temps : '+time}
  function spawn(){
    var b=document.createElement('button');b.className='gh';b.setAttribute('aria-label','cœur');b.innerHTML=hg;
    b.style.left=(Math.random()*76+4)+'%';b.style.top=(Math.random()*68+16)+'%';
    b.onclick=function(){score++;upd();b.remove()};
    $('arena').appendChild(b);setTimeout(function(){b.remove()},1300);
  }
  function startGame(){
    show('game');score=0;time=20;upd();$('result').hidden=true;$('arena').innerHTML='';
    clearInterval(spawner);clearInterval(ticker);
    spawner=setInterval(spawn,550);
    ticker=setInterval(function(){time--;upd();if(time<=0)stopGame()},1000);
  }
  function stopGame(){
    clearInterval(spawner);clearInterval(ticker);$('arena').innerHTML='';
    $('final').textContent='Score : '+score;$('result').hidden=false;
  }

  $('start').onclick=function(){show('choose')};
  $('angry').onclick=function(){pick($('angry'),'Grrr… qui a osé ?! Je vais lui parler.','shake',false)};
  $('happy').onclick=function(){pick($('happy'),'Yay ! Je suis trop contente !','jump',true)};
  $('yes').onclick=function(){show('verdict')};
  $('no').onclick=function(){show('letter');typeText()};
  $('replay').onclick=reset;
  $('end').onclick=startGame;
  $('again2').onclick=startGame;
})();
</script>
</body>
